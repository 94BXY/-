<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小屋 · BXY</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a14;--t:#e8e6f0;--d:#6b6b6b;--warm:#f4a460;--fire:#e25822;--gold:#ffd700}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);overflow:hidden;height:100vh;cursor:default;-webkit-font-smoothing:antialiased}

.sky{position:fixed;inset:0;background:url("bg-room.png") center/cover no-repeat,linear-gradient(180deg,rgba(10,10,30,0.55) 0%,rgba(26,26,62,0.45) 40%,rgba(42,26,46,0.4) 70%,rgba(26,10,10,0.5) 100%)}

.star{position:absolute;border-radius:50%;background:#fff;animation:twinkle var(--d) ease-in-out infinite;animation-delay:var(--dl)}
@keyframes twinkle{0%,100%{opacity:0.3}50%{opacity:1}}

.moon{position:absolute;top:8%;right:15%;width:60px;height:60px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#ffeedd,#f4c88a);box-shadow:0 0 40px rgba(255,200,100,0.3),0 0 80px rgba(255,180,80,0.15)}

.ground{position:absolute;bottom:0;left:0;right:0;height:35%;background:linear-gradient(180deg,#1a2a1a,#0d1a0d);border-radius:50% 50% 0 0 / 20px 20px 0 0}
.ground::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 40%,rgba(244,164,96,0.06),transparent)}

.house{position:absolute;bottom:24%;right:100px;width:260px;height:200px}

.house-body{position:absolute;bottom:0;left:30px;width:240px;height:170px;background:linear-gradient(180deg,#5c4332,#3d2918);border-radius:6px 6px 0 0;box-shadow:0 4px 30px rgba(0,0,0,0.5),inset 0 1px 0 rgba(255,255,255,0.03)}
.house-body::after{content:"";position:absolute;bottom:0;left:0;right:0;height:30px;background:linear-gradient(0deg,rgba(10,10,20,0.5),transparent);pointer-events:none}
.house-body::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,0.04)}

.house-roof{position:absolute;bottom:170px;left:10px;width:0;height:0;border-left:140px solid transparent;border-right:140px solid transparent;border-bottom:75px solid #4d3020;filter:drop-shadow(0 3px 8px rgba(0,0,0,0.4))}
.house-roof::after{content:"";position:absolute;top:60px;left:-134px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:10px solid #3d2518}

.house-door{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:52px;height:88px;background:linear-gradient(180deg,#4d3020,#2d1808);border-radius:8px 8px 0 0;box-shadow:inset 0 0 15px rgba(0,0,0,0.4),0 0 20px rgba(255,160,60,0.08)}
.house-door::before{content:"";position:absolute;top:8px;left:8px;right:8px;bottom:55%;border:1px solid rgba(255,255,255,0.04);border-radius:3px 3px 0 0}
.house-door::after{content:"";position:absolute;top:45%;right:10px;width:5px;height:5px;border-radius:50%;background:rgba(255,200,100,0.5);box-shadow:0 0 4px rgba(255,180,60,0.3)}

.window{position:absolute;width:52px;height:52px;background:radial-gradient(circle at 50% 50%,rgba(255,210,120,0.95),rgba(255,150,50,0.75));border-radius:6px;box-shadow:0 0 30px rgba(255,160,60,0.5),0 0 70px rgba(255,140,40,0.25),inset 0 0 12px rgba(255,200,120,0.4);animation:glow 3s ease-in-out infinite}
.window::before{content:"";position:absolute;inset:2px;border:1px solid rgba(0,0,0,0.2);border-radius:4px}
.window::after{content:"";position:absolute;top:0;left:50%;bottom:0;width:1px;background:rgba(0,0,0,0.15)}
.wl{left:60px;bottom:105px;animation-delay:0s}
.wr{right:60px;bottom:105px;animation-delay:1.5s}
@keyframes glow{0%,100%{box-shadow:0 0 30px rgba(255,160,60,0.4),0 0 60px rgba(255,140,40,0.2),inset 0 0 10px rgba(255,200,100,0.3)}50%{box-shadow:0 0 40px rgba(255,160,60,0.6),0 0 80px rgba(255,140,40,0.35),inset 0 0 15px rgba(255,200,100,0.4)}}

.chimney{position:absolute;bottom:170px;right:40px;width:36px;height:62px;background:linear-gradient(90deg,#4a3020,#3d2518,#4a3020);border-radius:3px 3px 0 0;box-shadow:-2px 0 4px rgba(0,0,0,0.2)}
.chimney::after{content:"";position:absolute;top:-3px;left:-3px;right:-3px;height:6px;background:#3d2518;border-radius:2px 2px 0 0}

.smoke{position:absolute;bottom:190px;right:45px;width:8px;height:8px;border-radius:50%;background:rgba(200,180,160,0.4);animation:rise 4s ease-out infinite;animation-delay:var(--sd)}
.smoke:nth-child(1){--sd:0s}
.smoke:nth-child(2){--sd:1.3s}
.smoke:nth-child(3){--sd:2.6s}
@keyframes rise{0%{opacity:0.5;transform:translate(0,0) scale(1)}50%{opacity:0.3;transform:translate(-15px,-40px) scale(2.5)}100%{opacity:0;transform:translate(-30px,-90px) scale(4)}}

.ember{position:absolute;border-radius:50%;background:radial-gradient(circle,#ff9944,#ff4400);animation:float-up var(--ft) ease-out infinite;animation-delay:var(--fd);pointer-events:none}
@keyframes float-up{0%{opacity:1;transform:translateY(0) translateX(0) scale(1)}100%{opacity:0;transform:translateY(-300px) translateX(var(--fx)) scale(0)}}

.trees{position:absolute;bottom:25%;width:100%;height:120px}
.tree{position:absolute;bottom:0;width:0;height:0;border-left:var(--tw) solid transparent;border-right:var(--tw) solid transparent;border-bottom:var(--th) solid #1a2a1a;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}

.overlay{position:fixed;inset:0;pointer-events:none;z-index:10}
.overlay::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse 60% 40% at 50% 60%,rgba(244,164,96,0.08),transparent 70%)}

.info{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);z-index:20;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}

.music-info{display:flex;align-items:center;gap:12px;padding:12px 24px;background:rgba(0,0,0,0.4);border:1px solid rgba(255,255,255,0.08);border-radius:50px;backdrop-filter:blur(10px)}
.music-icon{width:10px;height:10px;border-radius:2px;background:var(--warm);animation:eq 0.8s ease-in-out infinite}
.music-icon:nth-child(2){animation-delay:0.2s;height:14px}
.music-icon:nth-child(3){animation-delay:0.4s;height:8px}
@keyframes eq{0%,100%{transform:scaleY(1)}50%{transform:scaleY(2.5)}}
.music-text{font-size:0.72rem;color:rgba(255,255,255,0.6);letter-spacing:0.04em}
.music-text strong{color:var(--warm);font-weight:500}

.back-btn{padding:10px 28px;font-size:0.75rem;font-weight:600;font-family:inherit;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.04);color:rgba(255,255,255,0.5);cursor:pointer;border-radius:50px;transition:all 0.4s;letter-spacing:0.04em;text-decoration:none}
.back-btn:hover{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.3)}

.start-hint{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.7);cursor:pointer;transition:opacity 0.8s ease}
.start-hint.hidden{opacity:0;pointer-events:none}
.start-hint .hint-text{font-size:1.2rem;color:var(--warm);letter-spacing:0.08em;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.6}50%{opacity:1}}

.player{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(10,10,20,0.9);border-top:1px solid rgba(255,255,255,0.06);backdrop-filter:blur(20px);padding:10px 24px;display:flex;align-items:center;gap:16px;transform:translateY(100%);transition:transform 0.5s cubic-bezier(0.16,1,0.3,1)}
.player.on{transform:translateY(0)}
.player .p-cover{width:44px;height:44px;border-radius:6px;background:linear-gradient(135deg,#f4a460,#e25822);display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.player .p-info{flex:1;min-width:0}
.player .p-title{font-size:0.8rem;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player .p-artist{font-size:0.65rem;color:rgba(255,255,255,0.35);margin-top:2px}
.player .p-controls{display:flex;align-items:center;gap:12px}
.player .p-btn{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,0.12);background:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:0.9rem;transition:all 0.2s;flex-shrink:0}
.player .p-btn:hover{background:rgba(255,255,255,0.1);border-color:rgba(255,255,255,0.25)}
.player .p-bar-wrap{flex:1;max-width:200px;height:4px;background:rgba(255,255,255,0.08);border-radius:2px;cursor:pointer;position:relative}
.player .p-bar-fill{height:100%;background:linear-gradient(90deg,#f4a460,#e25822);border-radius:2px;width:0%;transition:width 0.1s linear;pointer-events:none}
.player .p-time{font-size:0.6rem;color:rgba(255,255,255,0.3);font-variant-numeric:tabular-nums;min-width:35px;text-align:right;flex-shrink:0}
.player .p-vol{width:60px;height:3px;background:rgba(255,255,255,0.08);border-radius:2px;cursor:pointer;flex-shrink:0}
.player .p-vol-fill{height:100%;background:rgba(255,255,255,0.4);border-radius:2px;width:70%;pointer-events:none}
@media(max-width:600px){.player{padding:8px 12px;gap:10px}.player .p-bar-wrap{display:none}.player .p-vol{display:none}}

/* Meteors */
.meteor{position:absolute;width:3px;height:120px;background:linear-gradient(0deg,#fff 0%,rgba(220,240,255,0.8) 10%,rgba(180,210,255,0.3) 30%,rgba(255,255,255,0) 100%);border-radius:50%;animation:shoot var(--mt) linear infinite;animation-delay:var(--md);opacity:0;pointer-events:none;box-shadow:0 0 8px rgba(200,220,255,0.6),0 0 20px rgba(180,200,255,0.15)}
@keyframes shoot{0%{opacity:0;transform:translate(0,0) rotate(45deg)}3%{opacity:1}12%{opacity:0;transform:translate(-400px,300px) rotate(45deg)}100%{opacity:0;transform:translate(-400px,300px) rotate(45deg)}}
</style>
</head>
<body>

<div class="start-hint" id="startHint" onclick="startAll()">
  <span class="hint-text">✦ 点击进入小屋 ✦</span>
</div>

<div class="sky" id="sky"></div>
<div id="meteors"></div>


/div>


<div class="house">
    <div class="house-tip">进入屋内</div>
  <div class="house-roof"></div>
  <div class="chimney"></div>
  <div class="smoke" style="--sd:0s"></div>
  <div class="smoke" style="--sd:1.3s"></div>
  <div class="smoke" style="--sd:2.6s"></div>
  <div class="house-body">
    <div class="window wl"></div>
    <div class="window wr"></div>
    <div class="house-door"></div>
  </div>
</div>

<div class="overlay"></div>

<div class="info">
  <div class="music-info">
    <div class="music-icon"></div>
    <div class="music-icon"></div>
    <div class="music-icon"></div>
    <span class="music-text"><strong>Magnolia</strong> · 氛围感</span>
  </div>
  <a href="index.html" class="back-btn">← 回到 BXY</a>
</div>



<script>
(function(){
  var sky = document.getElementById('sky');
  for (var i = 0; i < 60; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    s.style.cssText = 'left:' + (Math.random()*95).toFixed(1) + '%;top:' + (Math.random()*70).toFixed(1) + '%;width:' + (Math.random()*2+0.8).toFixed(1) + 'px;height:' + (Math.random()*2+0.8).toFixed(1) + 'px;--d:' + (Math.random()*3+2).toFixed(1) + 's;--dl:' + (Math.random()*3).toFixed(1) + 's';
    sky.appendChild(s);
  }

  // Meteors
  var mc = document.getElementById('meteors');
  for (var m = 0; m < 10; m++) {
    var met = document.createElement('div');
    met.className = 'meteor';
    met.style.cssText = 'left:' + (5 + Math.random()*80).toFixed(1) + '%;top:' + (2 + Math.random()*30).toFixed(1) + '%;--mt:' + (4 + Math.random()*6).toFixed(1) + 's;--md:' + (Math.random()*8).toFixed(1) + 's';
    mc.appendChild(met);
  }

  // Embers
  for (var e = 0; e < 20; e++) {
    var em = document.createElement('div');
    em.className = 'ember';
    em.style.cssText = 'left:' + (35+Math.random()*30).toFixed(1) + '%;bottom:' + (5+Math.random()*15).toFixed(1) + '%;width:' + (Math.random()*3+1.5).toFixed(1) + 'px;height:' + (Math.random()*3+1.5).toFixed(1) + 'px;--ft:' + (Math.random()*3+2).toFixed(1) + 's;--fd:' + (Math.random()*4).toFixed(1) + 's;--fx:' + (Math.random()*40-20).toFixed(0) + 'px';
    document.body.appendChild(em);
  }

  
// Player
var audio=document.getElementById("audio"),pl=document.getElementById("player"),
pp=document.getElementById("pPlay"),pb=document.getElementById("pBar"),pbf=document.getElementById("pBarFill"),
pt=document.getElementById("pTime"),pv=document.getElementById("pVol"),pvf=document.getElementById("pVolFill");
if(audio){audio.volume=0.5;pl.classList.add("on");
pp.addEventListener("click",function(){if(audio.paused){audio.play();pp.textContent="⏸"}else{audio.pause();pp.textContent="▶"}});
audio.addEventListener("play",function(){pp.textContent="⏸"});
audio.addEventListener("pause",function(){pp.textContent="▶"});
audio.addEventListener("timeupdate",function(){var p=audio.duration?(audio.currentTime/audio.duration*100):0;pbf.style.width=p+"%";var m=Math.floor(audio.currentTime/60),s=Math.floor(audio.currentTime%60);pt.textContent=m+":"+(s<10?"0":"")+s});
pb.addEventListener("click",function(e){var r=pb.getBoundingClientRect(),pct=(e.clientX-r.left)/r.width;audio.currentTime=pct*audio.duration});
pv.addEventListener("click",function(e){var r=pv.getBoundingClientRect(),pct=(e.clientX-r.left)/r.width;audio.volume=Math.max(0,Math.min(1,pct));pvf.style.width=(pct*100)+"%"});
audio.volume=0.5;pvf.style.width="50%";
}
window.startAll = function() {
    document.getElementById('startHint').classList.add('hidden');
    var a = document.getElementById('audio');
    a.play().then(function(){pp.textContent='⏸'}).catch(function(){});
  };
})();
</script>

<div class="player" id="player">
  <div class="p-cover">🔥</div>
  <div class="p-info">
    <div class="p-title">Magnolia</div>
    <div class="p-artist">氛围感の小曲</div>
  </div>
  <button class="p-btn" id="pPlay" title="播放/暂停">▶</button>
  <div class="p-bar-wrap" id="pBar"><div class="p-bar-fill" id="pBarFill"></div></div>
  <span class="p-time" id="pTime">0:00</span>
  <div class="p-vol" id="pVol"><div class="p-vol-fill" id="pVolFill"></div></div>
</div>
<audio id="audio" loop preload="auto" src="magnolia.aac"></audio>
</body>
</html>
