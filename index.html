<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BXY</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--t:#e8e6f0;--d:#6b6b6b;--l:rgba(255,255,255,0.08);--lh:rgba(255,255,255,0.2);--v:#7C3AED;--m:#EC4899;--c:#06B6D4}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:"Space Grotesk",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--t);-webkit-font-smoothing:antialiased}
canvas#pc{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg{position:fixed;inset:0;z-index:0;background:radial-gradient(ellipse 60% 50% at 50% 40%,rgba(124,58,237,0.12) 0%,transparent 60%);pointer-events:none}
main{position:relative;z-index:1}

.hero{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 24px;position:relative}
.hn{display:flex;gap:clamp(0.5rem,2vw,1.5rem);justify-content:center;margin-bottom:16px;perspective:800px}
.hn span{font-size:clamp(5rem,16vw,12rem);font-weight:700;line-height:1;background:linear-gradient(135deg,#fff 30%,#a78bfa 60%,#22d3ee 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;display:inline-block;cursor:default}
.hn span:hover{-webkit-text-fill-color:#fff;text-shadow:0 0 60px rgba(124,58,237,0.8),0 0 120px rgba(6,182,212,0.4)}
.hero .tag{font-size:clamp(0.9rem,2vw,1.1rem);color:var(--d);font-weight:400;letter-spacing:0.06em;max-width:400px;line-height:1.6}
.hero .sh{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);font-size:0.7rem;color:rgba(255,255,255,0.2);letter-spacing:0.1em;animation:bob 2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(8px)}}

section{padding:100px 24px 80px;max-width:900px;margin:0 auto}
.sl{font-size:0.7rem;font-weight:600;letter-spacing:0.12em;color:var(--d);margin-bottom:40px;text-transform:uppercase;display:flex;align-items:center;gap:12px}
.sl::after{content:"";flex:1;height:1px;background:var(--l)}
.rv{opacity:0;transform:translateY(30px);transition:opacity 0.8s ease,transform 0.8s cubic-bezier(0.16,1,0.3,1)}
.rv.on{opacity:1;transform:translateY(0)}

.pg{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--l)}
.pr{background:var(--bg);padding:40px 32px;transition:all 0.4s ease;cursor:default;position:relative}
.pr:hover{background:#0a0a0a}
.pr::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),rgba(124,58,237,0.08) 0%,transparent 60%);opacity:0;transition:opacity 0.4s ease;pointer-events:none}
.pr:hover::before{opacity:1}
.pr .pn{font-size:1.3rem;font-weight:600;margin-bottom:8px}
.pr .pd2{font-size:0.82rem;color:var(--d);line-height:1.5;margin-bottom:16px}
.pr .pt{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.pr .ptt{font-size:0.62rem;font-weight:600;letter-spacing:0.06em;padding:3px 10px;border:1px solid var(--l);color:var(--d)}
.pr .pl{font-size:0.75rem;color:var(--v);text-decoration:none;transition:color 0.2s}
.pr .pl:hover{color:#a78bfa}
.xd{margin-top:14px;font-size:0.6rem;font-family:inherit;color:rgba(255,255,255,0.12);background:none;border:none;cursor:pointer}
.xd:hover{color:var(--m)}

.ll{display:flex;flex-direction:column}
.li{padding:28px 0;border-bottom:1px solid var(--l);transition:border-color 0.3s}
.li:hover{border-color:var(--lh)}
.lh{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.ldt{font-size:0.68rem;color:rgba(255,255,255,0.25)}
.ltg{font-size:0.58rem;font-weight:700;letter-spacing:0.06em;padding:2px 8px;border:1px solid}
.lc{border-color:var(--v)!important;color:#a78bfa}
.lt2{border-color:var(--c)!important;color:#22d3ee}
.ln{border-color:var(--d)!important;color:var(--d)}
.lf{border-color:var(--m)!important;color:#f472b6}
.ltl{font-size:1rem;font-weight:600;margin-bottom:4px}
.ldc{font-size:0.78rem;color:var(--d);line-height:1.55}

.ml{display:flex;flex-direction:column}
.mi{padding:22px 0;border-bottom:1px solid var(--l)}
.mh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mau{font-size:0.85rem;font-weight:600;color:var(--c)}
.mtm{font-size:0.62rem;color:rgba(255,255,255,0.2)}
.mbd{font-size:0.82rem;color:var(--d);line-height:1.55}

.ab{display:flex;justify-content:flex-end;margin-bottom:32px}
.abn{padding:10px 28px;font-size:0.78rem;font-weight:600;font-family:inherit;border:1px solid var(--v);background:rgba(124,58,237,0.1);color:var(--v);cursor:pointer;transition:all 0.3s;letter-spacing:0.02em}
.abn:hover{background:var(--v);color:#fff}
.ef{display:none;margin-bottom:32px;padding:32px;border:1px solid var(--l)}
.ef.open{display:block;animation:fi 0.4s ease}
@keyframes fi{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.fr{margin-bottom:16px}
.fr label{display:block;font-size:0.65rem;font-weight:600;color:var(--d);margin-bottom:6px;letter-spacing:0.06em;text-transform:uppercase}
.fr input,.fr textarea,.fr select{width:100%;padding:12px 14px;font-size:0.84rem;font-family:inherit;background:rgba(255,255,255,0.03);border:1px solid var(--l);color:var(--t);outline:none;transition:border-color 0.3s}
.fr input:focus,.fr textarea:focus,.fr select:focus{border-color:var(--v)}
.fr textarea{resize:vertical;min-height:70px}
.fr select{cursor:pointer}
.fr select option{background:#000;color:var(--t)}
.fb{display:flex;gap:8px;justify-content:flex-end}
.btn{padding:9px 22px;font-size:0.76rem;font-weight:600;font-family:inherit;cursor:pointer;border:1px solid var(--l);background:none;color:var(--d);transition:all 0.3s}
.bs{background:var(--v);color:#fff;border-color:var(--v)}
.bs:hover{opacity:0.85}
.bc:hover{color:#fff;border-color:var(--lh)}

footer{padding:40px 24px 60px;text-align:center;border-top:1px solid var(--l);max-width:900px;margin:0 auto}
footer .fl{display:flex;justify-content:center;gap:32px;margin-bottom:16px}
footer .fl a{font-size:0.75rem;color:var(--d);text-decoration:none;transition:color 0.2s;letter-spacing:0.04em}
footer .fl a:hover{color:#fff}
footer .fi2{font-size:0.65rem;color:rgba(255,255,255,0.15)}

@media(max-width:600px){.pg{grid-template-columns:1fr}section{padding:60px 18px 50px}.pr{padding:28px 22px}}
</style>
</head>
<body>
<div class="bg"></div>
<canvas id="pc"></canvas>
<main>

<div class="hero" id="hero">
  <div class="hn" id="hName"><span>B</span><span>X</span><span>Y</span></div>
  <p class="tag">写代码 · 与 AI 协作 · 持续学习</p>
  <div class="sh">↓ 向下滚动</div>
</div>

<section id="projects">
  <div class="sl rv">作品</div>
  <div class="ab rv"><button class="abn" id="apb">+ 添加项目</button></div>
  <div class="ef" id="pf">
    <div class="fr"><label>项目名称</label><input id="pn" placeholder="项目名称"></div>
    <div class="fr"><label>简介</label><textarea id="pd" placeholder="一句话介绍"></textarea></div>
    <div class="fr"><label>技术标签</label><input id="pt2" placeholder="React, Node.js"></div>
    <div class="fr"><label>链接</label><input id="pl" placeholder="https://"></div>
    <div class="fb"><button class="btn bc" id="cpb">取消</button><button class="btn bs" id="spb">保存</button></div>
  </div>
  <div class="pg rv" id="pg"></div>
</section>

<section id="log">
  <div class="sl rv">学习日志</div>
  <div class="ab rv"><button class="abn" id="alb">+ 新增记录</button></div>
  <div class="ef" id="lf">
    <div class="fr"><label>分类</label><select id="lt"><option value="code">代码技巧</option><option value="tool">工具使用</option><option value="note">学习笔记</option><option value="fix">排错记录</option></select></div>
    <div class="fr"><label>标题</label><input id="ltl" placeholder="学到了什么？"></div>
    <div class="fr"><label>内容</label><textarea id="ls" placeholder="详细记录"></textarea></div>
    <div class="fb"><button class="btn bc" id="clb">取消</button><button class="btn bs" id="slb">保存</button></div>
  </div>
  <div class="ll rv" id="ll"></div>
</section>

<section id="messages">
  <div class="sl rv">留言</div>
  <div class="ef open" id="mf">
    <div class="fr"><label>名字</label><input id="ma" placeholder="怎么称呼你？"></div>
    <div class="fr"><label>留言</label><textarea id="mb" placeholder="说点什么..."></textarea></div>
    <div class="fb"><button class="btn bs" id="smb">发布</button></div>
  </div>
  <div class="ml rv" id="ml"></div>
</section>

<footer>
  <div class="fl"><a href="#">GitHub</a><a href="#">X</a><a href="#">博客</a><a href="#">联系</a></div>
  <div class="fi2">&copy; 2026 · <span id="ck"></span></div>
</footer>

</main>

<script>
(function(){
"use strict";

var C = document.getElementById('pc');
var X = C.getContext('2d');
var particles = [];
var mouse = { x: -1000, y: -1000 };
var PARTICLE_COUNT = 70;
var colors = ['124,58,237', '236,72,153', '6,182,212', '168,85,247', '244,114,182'];

function rs() {
  C.width = window.innerWidth;
  C.height = document.body.scrollHeight;
}

function cp() {
  var p = {
    homeX: Math.random() * C.width,
    homeY: Math.random() * C.height,
    x: 0, y: 0,
    vx: 0, vy: 0,
    size: Math.random() * 2 + 0.8,
    baseSize: 0,
    color: colors[Math.floor(Math.random() * colors.length)],
    springK: 0.015 + Math.random() * 0.025,
    damping: 0.7 + Math.random() * 0.03
  };
  p.x = p.homeX;
  p.y = p.homeY;
  p.baseSize = p.size;
  return p;
}

function ip() {
  particles = [];
  for (var i = 0; i < PARTICLE_COUNT; i++) {
    particles.push(cp());
  }
}

function up() {
  var mouseActive = mouse.x > 0;
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    p.vx += (p.homeX - p.x) * p.springK;
    p.vy += (p.homeY - p.y) * p.springK;
    if (mouseActive) {
      var dx = p.x - mouse.x;
      var dy = p.y - mouse.y;
      var dist = Math.sqrt(dx * dx + dy * dy) || 1;
      if (dist < 180) {
        var force = (180 - dist) / 180;
        p.vx += (dx / dist) * force * 0.6;
        p.vy += (dy / dist) * force * 0.6;
        p.size += (p.baseSize + force * 2.5 - p.size) * 0.2;
      } else {
        p.size += (p.baseSize - p.size) * 0.1;
      }
    } else {
      p.size += (p.baseSize - p.size) * 0.1;
    }
    p.vx *= p.damping;
    p.vy *= p.damping;
    p.x += p.vx;
    p.y += p.vy;
  }
}

function dp() {
  var sy = window.scrollY;
  X.clearRect(0, 0, C.width, C.height);
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var py = p.y - sy;
    var hy = p.homeY - sy;
    var dx = p.x - p.homeX;
    var dy = py - hy;
    var displace = Math.sqrt(dx * dx + dy * dy);
    if (displace > 8) {
      var alpha = Math.min(displace / 80, 0.25);
      X.beginPath();
      X.moveTo(p.homeX, hy);
      var midX = (p.homeX + p.x) / 2;
      var midY = (hy + py) / 2;
      var perpX = -(py - hy) * 0.2;
      var perpY = (p.x - p.homeX) * 0.2;
      X.quadraticCurveTo(midX + perpX, midY + perpY, p.x, py);
      X.strokeStyle = 'rgba(' + p.color + ',' + alpha + ')';
      X.lineWidth = 0.4;
      X.stroke();
    }
  }
  for (var i = 0; i < particles.length; i++) {
    var p = particles[i];
    var py = p.y - sy;
    var hy = p.homeY - sy;
    X.beginPath();
    X.arc(p.x, py, p.size, 0, Math.PI * 2);
    X.fillStyle = 'rgba(' + p.color + ',' + (0.35 + p.size * 0.18) + ')';
    X.fill();
    X.beginPath();
    X.arc(p.x, py, p.size * 2.5, 0, Math.PI * 2);
    X.fillStyle = 'rgba(' + p.color + ',0.06)';
    X.fill();
    var dx2 = p.x - p.homeX;
    var dy2 = py - hy;
    if (Math.sqrt(dx2 * dx2 + dy2 * dy2) > 5) {
      X.beginPath();
      X.arc(p.homeX, hy, 1, 0, Math.PI * 2);
      X.fillStyle = 'rgba(' + p.color + ',0.15)';
      X.fill();
    }
  }
  for (var i = 0; i < particles.length; i++) {
    for (var j = i + 1; j < particles.length; j++) {
      var piy = particles[i].y - sy;
      var pjy = particles[j].y - sy;
      var dx3 = particles[i].x - particles[j].x;
      var dy3 = piy - pjy;
      var dist3 = Math.sqrt(dx3 * dx3 + dy3 * dy3);
      if (dist3 < 90) {
        var alpha3 = (1 - dist3 / 90) * 0.1;
        X.beginPath();
        X.moveTo(particles[i].x, piy);
        X.lineTo(particles[j].x, pjy);
        X.strokeStyle = 'rgba(124,58,237,' + alpha3 + ')';
        X.lineWidth = 0.4;
        X.stroke();
      }
    }
  }
  var my = mouse.y - sy;
  if (mouse.x > 0 && my > 0) {
    var grad = X.createRadialGradient(mouse.x, my, 0, mouse.x, my, 100);
    grad.addColorStop(0, 'rgba(168,85,247,0.08)');
    grad.addColorStop(1, 'rgba(168,85,247,0)');
    X.beginPath();
    X.arc(mouse.x, my, 100, 0, Math.PI * 2);
    X.fillStyle = grad;
    X.fill();
  }
}

function ap() {
  up();
  dp();
  requestAnimationFrame(ap);
}

document.addEventListener('mousemove', function(e) {
  mouse.x = e.clientX;
  mouse.y = e.clientY + window.scrollY;
});

document.addEventListener('mouseleave', function() {
  mouse.x = -1000;
  mouse.y = -1000;
});

window.addEventListener('resize', function() {
  rs();
  ip();
});

var LK = 'cll_v8', PK = 'cpl_v3', MK = 'cml_v3';
var logs = [], projs = [], msgs = [];
var defLogs = [
  {tag:'note',date:'2026-05-12',title:'前端设计技能',summary:'学习了Codex frontend-design技能的8个设计锚点。'},
  {tag:'tool',date:'2026-05-12',title:'Codex技能系统',summary:'技能存储在SKILL.md中，支持渐进式加载，按需读取。'},
  {tag:'code',date:'2026-05-12',title:'弹簧粒子+API部署',summary:'Hooke定律弹簧物理+贝塞尔曲线连线。Netlify API自动部署。'},
  {tag:'note',date:'2026-05-12',title:'免费Netlify部署',summary:'Netlify Drop拖拽上传，3秒上线，无需命令行。'},
  {tag:'fix',date:'2026-05-12',title:'PowerShell编码问题',summary:'中文输出必须使用UTF-8编码，否则全部乱码。'},
  {tag:'code',date:'2026-05-13',title:'弹簧粒子系统重构',summary:'修复画布ID、动画循环、全页粒子scrollHeight覆盖、requestAnimationFrame驱动。'},
  {tag:'note',date:'2026-05-13',title:'BXY v1.2 正式发布',summary:'学习日志中文化、排序修复、粒子滚动跟随、全页覆盖。所有中文化，按日期最新在前。'},
];

function ld(k, d) { try { var r = localStorage.getItem(k); return r ? JSON.parse(r) : d.slice(); } catch(e) { return d.slice(); } }
function sv(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} }
function es(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
function mg(arr, defs) {
  for (var i = 0; i < defs.length; i++) {
    var f = false;
    for (var j = 0; j < arr.length; j++) { if (arr[j].title === defs[i].title) { f = true; break; } }
    if (!f) arr.push(defs[i]);
  }
  return arr;
}

function rp() {
  var g = document.getElementById('pg'); if (!g) return;
  if (!projs.length) { g.innerHTML = '<div style="padding:60px;text-align:center;color:var(--d);font-size:0.85rem">暂无项目</div>'; return; }
  var s = projs.slice().reverse(), h = '';
  for (var i = 0; i < s.length; i++) {
    var p = s[i], idx = projs.indexOf(p);
    var tags = (p.tags || '').split(',').filter(function(t){return t.trim()}).map(function(t){return '<span class="ptt">' + es(t.trim()) + '</span>'}).join('');
    h += '<div class="pr rv" data-i="' + idx + '"><div class="pn">' + es(p.name) + '</div><div class="pd2">' + es(p.desc) + '</div><div class="pt">' + tags + '</div>' + (p.link ? '<a class="pl" href="' + es(p.link) + '" target="_blank">??</a>' : '') + '<button class="xd">删除</button></div>';
  }
  g.innerHTML = h;
  var ds = g.querySelectorAll('.xd');
  for (var d = 0; d < ds.length; d++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var ii = parseInt(el.parentElement.getAttribute('data-i'));
        if (ii >= 0) { projs.splice(ii, 1); sv(PK, projs); rp(); obs(); }
      });
    })(ds[d]);
  }
  var pcs = g.querySelectorAll('.pr');
  for (var c = 0; c < pcs.length; c++) {
    (function(card) {
      card.addEventListener('mousemove', function(e) {
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', ((e.clientX - r.left) / r.width * 100).toFixed(1) + '%');
        card.style.setProperty('--my', ((e.clientY - r.top) / r.height * 100).toFixed(1) + '%');
      });
    })(pcs[c]);
  }
}

function rl() {
  var l = document.getElementById('ll'); if (!l) return;
  if (!logs.length) { l.innerHTML = '<div style="padding:60px;text-align:center;color:var(--d);font-size:0.85rem">暂无记录</div>'; return; }
  var s = logs.slice().reverse(), h = '';
  for (var i = 0; i < s.length; i++) {
    var e = s[i], idx = logs.indexOf(e);
    var tc = 'l' + e.tag.charAt(0);
    var tl = e.tag === 'code' ? '代码' : e.tag === 'tool' ? '工具' : e.tag === 'note' ? '笔记' : '修复';
    h += '<div class="li rv"><div class="lh"><span class="ldt">' + es(e.date) + '</span><span class="ltg ' + tc + '">' + tl + '</span></div><div class="ltl">' + es(e.title) + '</div><div class="ldc">' + es(e.summary) + '</div><button class="xd" data-i="' + idx + '">删除</button></div>';
  }
  l.innerHTML = h;
  var ds = l.querySelectorAll('.xd');
  for (var d = 0; d < ds.length; d++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var ii = parseInt(this.getAttribute('data-i'));
        if (ii >= 0) { logs.splice(ii, 1); sv(LK, logs); rl(); obs(); }
      });
    })(ds[d]);
  }
}

function rm() {
  var l = document.getElementById('ml'); if (!l) return;
  if (!msgs.length) { l.innerHTML = '<div style="padding:60px;text-align:center;color:var(--d);font-size:0.85rem">暂无留言</div>'; return; }
  var s = msgs.slice().reverse(), h = '';
  for (var i = 0; i < s.length; i++) {
    var m = s[i], idx = msgs.indexOf(m);
    h += '<div class="mi rv"><div class="mh"><span class="mau">' + es(m.author || '??') + '</span><span class="mtm">' + es(m.date) + ' ' + es(m.time || '') + '</span></div><div class="mbd">' + es(m.body) + '</div><button class="xd" data-i="' + idx + '">删除</button></div>';
  }
  l.innerHTML = h;
  var ds = l.querySelectorAll('.xd');
  for (var d = 0; d < ds.length; d++) {
    (function(el) {
      el.addEventListener('click', function(e) {
        e.stopPropagation();
        var ii = parseInt(this.getAttribute('data-i'));
        if (ii >= 0) { msgs.splice(ii, 1); sv(MK, msgs); rm(); obs(); }
      });
    })(ds[d]);
  }
}

var ob;
function obs() {
  if (ob) ob.disconnect();
  ob = new IntersectionObserver(function(es) {
    for (var i = 0; i < es.length; i++) { if (es[i].isIntersecting) es[i].target.classList.add('on'); }
  }, { threshold: 0.1 });
  var els = document.querySelectorAll('.rv');
  for (var i = 0; i < els.length; i++) ob.observe(els[i]);
}

var hn = document.getElementById('hName');
if (hn) {
  document.addEventListener('mousemove', function(e) {
    var r = hn.getBoundingClientRect();
    var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    var dx = (e.clientX - cx) / window.innerWidth, dy = (e.clientY - cy) / window.innerHeight;
    var ss = hn.querySelectorAll('span');
    if (ss[0]) ss[0].style.transform = 'translate3d(' + (dx * -20) + 'px,' + (dy * -15) + 'px,0) rotateY(' + (dx * 10) + 'deg)';
    if (ss[1]) ss[1].style.transform = 'translate3d(' + (dx * -3) + 'px,' + (dy * -18) + 'px,0)';
    if (ss[2]) ss[2].style.transform = 'translate3d(' + (dx * 15) + 'px,' + (dy * -10) + 'px,0) rotateY(' + (dx * -8) + 'deg)';
  });
}
